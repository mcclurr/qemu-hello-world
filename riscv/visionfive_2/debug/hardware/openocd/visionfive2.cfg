adapter driver jlink
bindto 0.0.0.0
transport select jtag
adapter speed 100

jtag newtap vf2 tap0 \
    -irlen 5 \
    -expected-id 0x07110cfd

jtag newtap vf2 tap1 \
    -irlen 5 \
    -expected-id 0x07110cfd

target create vf2.hart0 riscv \
    -chain-position vf2.tap1 \
    -coreid 0

target create vf2.hart1 riscv \
    -chain-position vf2.tap1 \
    -coreid 1 \
    -rtos hwthread

target create vf2.hart2 riscv \
    -chain-position vf2.tap1 \
    -coreid 2

target create vf2.hart3 riscv \
    -chain-position vf2.tap1 \
    -coreid 3

target create vf2.hart4 riscv \
    -chain-position vf2.tap1 \
    -coreid 4

target smp \
    vf2.hart1 \
    vf2.hart2 \
    vf2.hart3 \
    vf2.hart4

targets vf2.hart1